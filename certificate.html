<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate - Ten Shrines</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      background: linear-gradient(135deg, #faf8f5 0%, #f5f0e8 100%);
      min-height: 100vh; padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #8B0000; margin-bottom: 5px; font-size: 20px; }
    .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }
    
    .upload-area {
      border: 3px dashed #c41e3a; border-radius: 16px; padding: 40px;
      text-align: center; background: white; margin-bottom: 20px;
    }
    .upload-btn {
      background: linear-gradient(135deg, #c41e3a 0%, #8B0000 100%);
      color: white; padding: 15px 40px; border-radius: 12px;
      border: none; font-size: 18px; font-weight: 600; cursor: pointer;
    }
    #preview { max-width: 100%; margin-top: 20px; border-radius: 8px; display: none; }
    
    .certificate {
      background: white; padding: 30px 20px; border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center;
      max-width: 400px; margin: 0 auto; border: 3px solid #c41e3a;
      display: none;
    }
    .cert-icon { font-size: 40px; margin-bottom: 10px; }
    .cert-title { font-size: 22px; color: #8B0000; margin-bottom: 5px; font-weight: bold; }
    .cert-subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
    
    .cert-photo {
      width: 180px; height: 180px; object-fit: cover;
      border-radius: 50%; border: 4px solid #c41e3a;
      margin: 0 auto 20px; display: block;
    }
    .cert-name { font-size: 32px; color: #c41e3a; margin: 15px 0; font-weight: bold; }
    
    .stamps-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      margin: 20px auto; max-width: 320px; padding: 12px;
      background: #f8f8f8; border-radius: 12px;
    }
    .stamp-thumb { width: 100%; border-radius: 6px; }
    
    .cert-date { color: #888; margin-top: 15px; font-size: 14px; }
    .cert-seal { font-size: 36px; margin-top: 10px; }
    
    .sakura {
      position: fixed; top: -10%; font-size: 24px; 
      animation: fall linear infinite; pointer-events: none;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container" id="uploadSection">
    <h1>🏆 Your Journey Complete!</h1>
    <div class="stamps-grid" id="stampsGrid"></div>
    <div class="upload-area">
      <p style="color: #666; margin-bottom: 20px;">Upload your photo to generate certificate</p>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <button class="upload-btn" onclick="document.getElementById('photoInput').click()">📷 Select Photo</button>
      <img id="preview">
      <br><br>
      <button class="upload-btn" id="generateBtn" style="display:none;" onclick="generate()">✨ Generate Certificate</button>
    </div>
  </div>

  <div class="certificate" id="certificateSection">
    <div class="cert-icon">⛩️</div>
    <div class="cert-title">Ten Shrines · One Journey</div>
    <div class="cert-subtitle">Certificate of Completion</div>
    
    <img id="certPhoto" class="cert-photo">
    <div class="cert-name" id="certName"></div>
    
    <div class="stamps-grid" id="certStamps"></div>
    
    <div class="cert-date" id="certDate"></div>
    <div class="cert-seal">🌸</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name') || 'Visitor';
    
    const shrineImages = [
      "https://i.ibb.co/fzG9hKJ2/B0031959-81-B0-4-D59-BE9-B-A604-D1-F5-F5-FD.png",
      "https://i.ibb.co/8gNJZ05N/EBCC9-E01-F032-45-D8-8804-9757-BCF014-F0.png",
      "https://i.ibb.co/BDRvzsQ/F8-E25-DE0-7408-409-C-90-CF-22-E2-E34-A33-F6.png",
      "https://i.ibb.co/sdx9TdXZ/938425-DB-3-DD3-4-DAE-AEB7-E1638-B122849.png",
      "https://i.ibb.co/fzC1ZxCV/IMG-3194.png",
      "https://i.ibb.co/kVJXgrt6/734-E9-F41-0-DF1-4-CD3-90-CA-2-E789-D96-D496.png",
      "https://i.ibb.co/SwpFg3Xs/01979-EEF-380-B-4-D94-8-E0-F-698-EA7-B38980.png",
      "https://i.ibb.co/20tn7nSJ/D7-FA715-F-F1-DA-4259-9-C60-1207-A5-C4-D557.png",
      "https://i.ibb.co/zTCR1x0X/IMG-3179.png",
      "https://i.ibb.co/zVFS9fmY/36802-F65-3601-43-FC-84-AE-41-E80-A7-BD68-D.png"
    ];
    
    // 上传页显示10个朱印
    const grid = document.getElementById('stampsGrid');
    shrineImages.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'stamp-thumb';
      grid.appendChild(img);
    });
    
    // 照片上传预览
    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('preview').src = e.target.result;
          document.getElementById('preview').style.display = 'block';
          document.getElementById('generateBtn').style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
      }
    });
    
    // 生成证书
    function generate() {
      document.getElementById('uploadSection').style.display = 'none';
      document.getElementById('certificateSection').style.display = 'block';
      
      // 显示姓名
      document.getElementById('certName').textContent = name;
      
      // 显示日期
      document.getElementById('certDate').textContent = new Date().toLocaleDateString();
      
      // 显示游客照片
      document.getElementById('certPhoto').src = document.getElementById('preview').src;
      
      // 证书页显示10个朱印
      const stampContainer = document.getElementById('certStamps');
      shrineImages.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'stamp-thumb';
        stampContainer.appendChild(img);
      });
      
      // 樱花动画
      for(let i=0; i<15; i++) {
        const sakura = document.createElement('div');
        sakura.className = 'sakura';
        sakura.innerHTML = '🌸';
        sakura.style.left = Math.random() * 100 + '%';
        sakura.style.animationDuration = (Math.random() * 3 + 2) + 's';
        sakura.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(sakura);
      }
    }
  </script>
</body>
</html>
